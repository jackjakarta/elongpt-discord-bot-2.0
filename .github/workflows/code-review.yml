name: Code Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true

concurrency:
  group: code-review-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  code-review:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Load 1password secrets
        id: op-secrets
        uses: 1password/load-secrets-action@v4
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: "op://elon-gpt/github-secrets/CLAUDE_CODE_OAUTH_TOKEN"

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Claude code review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ steps.op-secrets.outputs.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ inputs.pr_number }}

            Please review this pull request with a focus on:
            - Code quality and best practices
            - Potential bugs or issues
            - Security implications
            - Performance considerations

            Use `gh pr comment` for top-level feedback.
            Only post GitHub comments — don't submit review text as messages.
          claude_args: |
            --model claude-opus-5
            --effort xhigh
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
