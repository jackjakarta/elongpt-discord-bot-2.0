name: Build and Deploy Bot

on:
  push:
    tags:
      - "*.*.*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy"
        required: true
        default: ""

concurrency:
  group: deploy-bot
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    needs: checks

    steps:
      - name: Set up Docker image tags
        id: vars
        run: |
          echo "TAG_VERSION=${{ inputs.tag || github.ref_name }}" >> $GITHUB_ENV

      - name: Load 1password secrets
        id: build-secrets
        uses: 1password/load-secrets-action@v4
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          DOCKER_USERNAME: "op://elon-gpt/github-secrets/DOCKER_USERNAME"
          DOCKER_PASSWORD: "op://elon-gpt/github-secrets/DOCKER_PASSWORD"

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ steps.build-secrets.outputs.DOCKER_USERNAME }}
          password: ${{ steps.build-secrets.outputs.DOCKER_PASSWORD }}

      - name: Build and push docker image
        run: |
          docker build --no-cache \
          -t ghcr.io/${{ steps.build-secrets.outputs.DOCKER_USERNAME }}/elongpt:${{ env.TAG_VERSION }} \
          -t ghcr.io/${{ steps.build-secrets.outputs.DOCKER_USERNAME }}/elongpt:latest . && \
          docker push ghcr.io/${{ steps.build-secrets.outputs.DOCKER_USERNAME }}/elongpt:${{ env.TAG_VERSION }} && \
          docker push ghcr.io/${{ steps.build-secrets.outputs.DOCKER_USERNAME }}/elongpt:latest

  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    needs: build
    env:
      HETZNER_FIREWALL: web-default-firewall

    steps:
      - name: Set up Docker image tags
        id: vars
        run: |
          echo "TAG_VERSION=${{ inputs.tag || github.ref_name }}" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v4

      - name: Inject bot secrets into .env
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: ENVIRONMENT=production op inject -f -i .env.op -o .env

      - name: Load deploy secrets
        id: deploy-secrets
        uses: 1password/load-secrets-action@v4
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          DOCKER_USERNAME: "op://elon-gpt/github-secrets/DOCKER_USERNAME"
          DOCKER_PASSWORD: "op://elon-gpt/github-secrets/DOCKER_PASSWORD"
          REMOTE_HOST: "op://elon-gpt/github-secrets/REMOTE_HOST"
          REMOTE_USER: "op://elon-gpt/github-secrets/REMOTE_USER"
          SSH_PRIVATE_KEY: "op://elon-gpt/github-secrets/SSH_PRIVATE_KEY"
          HCLOUD_TOKEN: "op://elon-gpt/github-secrets/HCLOUD_TOKEN"

      - name: Pin deployed image in .env
        run: |
          sed -i '/^ELONGPT_IMAGE=/d' .env
          echo "ELONGPT_IMAGE=ghcr.io/${{ steps.deploy-secrets.outputs.DOCKER_USERNAME }}/elongpt:${{ env.TAG_VERSION }}" >> .env

      - name: Install hcloud CLI
        uses: hetznercloud/setup-hcloud@v1

      - name: Get runner public IP
        id: runner-ip
        run: |
          ip=$(curl -4 -fsS --retry 3 https://api.ipify.org)
          if ! [[ "$ip" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not determine runner IPv4, got: '$ip'" >&2
            exit 1
          fi
          echo "ip=$ip" >> "$GITHUB_OUTPUT"

      # Scoped to this runner's IP only; removed again in the always() step below.
      - name: Open SSH on Hetzner firewall for this runner
        id: open-ssh
        env:
          HCLOUD_TOKEN: ${{ steps.deploy-secrets.outputs.HCLOUD_TOKEN }}
        run: |
          hcloud firewall add-rule "$HETZNER_FIREWALL" \
            --direction in --protocol tcp --port 22 \
            --source-ips "${{ steps.runner-ip.outputs.ip }}/32" \
            --description "ci-deploy-ssh"

      - name: Copy .env and compose file to remote server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ steps.deploy-secrets.outputs.REMOTE_HOST }}
          username: ${{ steps.deploy-secrets.outputs.REMOTE_USER }}
          key: ${{ steps.deploy-secrets.outputs.SSH_PRIVATE_KEY }}
          source: ".env,docker-compose.yml"
          target: "~/elongpt"

      - name: Deploy to remote server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ steps.deploy-secrets.outputs.REMOTE_HOST }}
          username: ${{ steps.deploy-secrets.outputs.REMOTE_USER }}
          key: ${{ steps.deploy-secrets.outputs.SSH_PRIVATE_KEY }}
          script: |
            cd ~/elongpt
            echo "${{ steps.deploy-secrets.outputs.DOCKER_PASSWORD }}" | docker login ghcr.io -u "${{ steps.deploy-secrets.outputs.DOCKER_USERNAME }}" --password-stdin

            docker compose pull
            docker compose up -d

      # Runs even if the deploy failed or was cancelled, so the port never stays open.
      # Flags must match the add-rule call exactly — hcloud deletes by matching the whole rule.
      - name: Close SSH on Hetzner firewall
        if: always() && steps.open-ssh.outcome != 'skipped'
        env:
          HCLOUD_TOKEN: ${{ steps.deploy-secrets.outputs.HCLOUD_TOKEN }}
        run: |
          hcloud firewall delete-rule "$HETZNER_FIREWALL" \
            --direction in --protocol tcp --port 22 \
            --source-ips "${{ steps.runner-ip.outputs.ip }}/32" \
            --description "ci-deploy-ssh"
