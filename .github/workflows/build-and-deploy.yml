name: Build and Deploy Bot

on:
  push:
    tags:
      - "*.*.*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy"
        required: true
        default: ""

concurrency:
  group: deploy-bot
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Read Python version
        id: python_version
        run: |
          echo "PYTHON_VERSION=$(cat .python-version)" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "${{ env.PYTHON_VERSION }}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements-dev.txt

      - name: Format check
        run: |
          black --check .

      - name: Import order check
        run: |
          isort --check-only .

      - name: Linting check
        run: |
          flake8 .

  build:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    needs: checks

    steps:
      - name: Set up Docker image tags
        id: vars
        run: |
          echo "TAG_VERSION=${{ inputs.tag || github.ref_name }}" >> $GITHUB_ENV

      - name: Load 1password secrets
        uses: 1password/load-secrets-action@v4
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          DOCKER_USERNAME: "op://elon-gpt/github-secrets/DOCKER_USERNAME"
          DOCKER_PASSWORD: "op://elon-gpt/github-secrets/DOCKER_PASSWORD"

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build and push docker image
        run: |
          docker build --no-cache \
          -t ghcr.io/${{ env.DOCKER_USERNAME }}/elongpt:${{ env.TAG_VERSION }} \
          -t ghcr.io/${{ env.DOCKER_USERNAME }}/elongpt:latest . && \
          docker push ghcr.io/${{ env.DOCKER_USERNAME }}/elongpt:${{ env.TAG_VERSION }} && \
          docker push ghcr.io/${{ env.DOCKER_USERNAME }}/elongpt:latest

  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    needs: build

    steps:
      - name: Set up Docker image tags
        id: vars
        run: |
          echo "TAG_VERSION=${{ inputs.tag || github.ref_name }}" >> $GITHUB_ENV

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v4

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Inject bot secrets into .env
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: ENVIRONMENT=production op inject -f -i .env.op -o .env

      - name: Load deploy secrets
        uses: 1password/load-secrets-action@v4
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          DOCKER_USERNAME: "op://elon-gpt/github-secrets/DOCKER_USERNAME"
          DOCKER_PASSWORD: "op://elon-gpt/github-secrets/DOCKER_PASSWORD"
          REMOTE_HOST: "op://elon-gpt/github-secrets/REMOTE_HOST"
          REMOTE_USER: "op://elon-gpt/github-secrets/REMOTE_USER"
          SSH_PRIVATE_KEY: "op://elon-gpt/github-secrets/SSH_PRIVATE_KEY"

      - name: Pin deployed image in .env
        run: |
          sed -i '/^ELONGPT_IMAGE=/d' .env
          echo "ELONGPT_IMAGE=ghcr.io/${{ env.DOCKER_USERNAME }}/elongpt:${{ env.TAG_VERSION }}" >> .env

      - name: Copy .env and compose file to remote server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ env.REMOTE_HOST }}
          username: ${{ env.REMOTE_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          source: ".env,docker-compose.yml"
          target: "~/elongpt"

      - name: Deploy to remote server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.REMOTE_HOST }}
          username: ${{ env.REMOTE_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          script: |
            cd ~/elongpt
            echo "${{ env.DOCKER_PASSWORD }}" | docker login ghcr.io -u "${{ env.DOCKER_USERNAME }}" --password-stdin

            docker compose pull
            docker compose up -d
