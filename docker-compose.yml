services:
  bot:
    image: ${ELONGPT_IMAGE:?ELONGPT_IMAGE must be set (CI sets it; locally use ELONGPT_IMAGE=elongpt:dev)}
    build: .
    container_name: elongpt-bot
    env_file:
      - .env
    restart: always
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
